name: ai-only
description: |
  AI-inference-focused: tuned for token-generation latency (autoregressive
  decode is a serial per-token CPU<->GPU dispatch loop, not a parallel
  batch-throughput problem) as well as long-running batch CUDA jobs
  (vLLM, llama.cpp, diffusers). Full preemption — low scheduling latency
  for the CUDA dispatch thread matters more here than the small aggregate
  throughput cost of more context switches. Keeps mitigations ON.

fragments:
  - 05-ubuntu-26-boot.config   # MUST be first (boot floor)
  - 10-preempt-full.config
  - 11-hz-1000.config
  - 12-scheduler-bore-scx.config
  - 13-energy-intel-hybrid.config
  - 20-mitigations-on.config
  - 21-ai-gpu-mem.config
  - 33-pcie-dma-substrate.config
  - 30-mm-thp-mglru.config
  - 31-mm-zswap-zstd.config
  - 32-mm-damon.config
  - 40-iommu-vfio.config
  - 42-io-uring-bpf.config
  - 60-nvidia-wayland.config
  - 61-no-amdgpu-no-nouveau.config
  - 80-raptorlake-intel.config
  - 81-native-cpu-opt.config
  - 70-greenboost-required.config

cmdline_extra:
  - "transparent_hugepage=always"
  # NOTE: confirmed via `nvme id-ctrl` (2026-06-25) that this drive's HMPRE is
  # exactly 64 MiB, already fully satisfied by the in-tree 128 MiB default
  # cap (dmesg: "allocated 64 MiB host memory buffer"). Raising the cap is a
  # no-op for this drive — deliberately not added here.
  # Confirmed on real hardware: exposed C-states are C1_ACPI(1us)/C2_ACPI(127us)/
  # C3_ACPI(1048us) — acpi_idle is the active driver here, not intel_idle, so
  # both params are set to cover whichever ends up active. Caps the worst-case
  # wake-up tax between decode steps at ~1us instead of paying up to ~1ms if a
  # P-core drops into C3 between tokens. Trade: higher idle power/heat on
  # P-cores. Deliberately scoped to ai-only, not gaming-ai-vm — the latter
  # still wants idle power savings outside of inference bursts.
  - "intel_idle.max_cstate=1"
  - "processor.max_cstate=1"

patches:
  # patches/series (ubuntu mode) or patches/kernel-org-7.1/series (kernel-org
  # mode, per --source-mode) governs actual patch application. Listed here
  # for documentation and dry-run reporting only.
  - 0001-cachyos-bore-scheduler.patch
  - 0002-xanmod-bbr3.patch
  - 0003-xanmod-zen-vmscan-swap.patch
  - 0004-xanmod-zen-vfs-cache.patch
  - 0005-xanmod-zen-max-map-count.patch
  - 0006-xanmod-zen-500hz-timer.patch
  - 0007-xanmod-zen-sched-latency.patch
  - 0008-xanmod-zen-dm-crypt-wq.patch
  - 0009-xanmod-zen-evdev-rcu.patch
  - 0010-xanmod-blk-wbt-latency.patch
  - 0011-xanmod-blk-rq-affinity.patch
  - 0012-xanmod-mq-deadline-front-merge.patch
  - 0013-xanmod-mq-deadline-write-prio.patch
  - 0014-tkg-pci-pme-timeout.patch
  - 0015-nvme-lower-default-apst-latency.patch
  - 0016-mm-thp-defrag-defer-madvise-default.patch
  - custom/0017-kbuild-ubsan-extmod-opt-in.patch
  - custom/0019-dma-buf-priority-hint.patch
  - custom/0020-dma-buf-compressed-descriptor.patch

dkms_modules:
  - nvidia-dkms
  - greenboost
