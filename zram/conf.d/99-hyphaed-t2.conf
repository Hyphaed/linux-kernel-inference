# zram-first swap — optimal-kernel plan Phase G item 5.
# Direct mitigation for the 2026-07-24 crash: 19.5 G swap peak landed entirely
# on disk-backed swap (no zram device existed), producing
# `swap_reclaim_work hogged CPU >10000us` x515 — the same iowait-thrash family
# as the 2026-07-09 incident. zstd-compressed RAM absorbs the first tier of
# swap pressure at RAM speed instead of NVMe/disk speed.
#
# Neither existing swap device (/swap.img — stock Ubuntu installer swapfile,
# untouched by GreenBoost by design; /var/lib/greenboost/swapfile — GreenBoost-
# owned, greenboost_setup.sh) has an explicit priority in /etc/fstab, so both
# sit at the kernel default (-1). Giving zram an explicit positive priority
# here is sufficient to make the kernel drain it first — no fstab edits needed
# on either existing swap file.
#
# Lives in conf.d/, not /etc/systemd/zram-generator.conf directly: on this
# system (systemd-zram-generator 1.2.1-2) the single top-level config file
# was silently not being read — every applied value (Priority=100, size=4G)
# exactly matched the tool's compiled defaults, not this file's content, even
# though the file was present with valid syntax. zram-generator.conf(5) is
# unambiguous that conf.d/ drop-ins always override the single config file,
# so that's the reliable path — don't reintroduce a bare
# /etc/systemd/zram-generator.conf, it won't take effect on this box.
[zram0]
zram-size = min(ram / 4, 8192)
compression-algorithm = zstd
swap-priority = 100
