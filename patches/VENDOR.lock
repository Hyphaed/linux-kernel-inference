# ─── TKG (orig. Alex Williamson/lkml): PCIe ACS override ─────────────────────
# Enables pcie_acs_override= boot param — needed for clean IOMMU groups on
# workload #3 (VFIO/KVM passthrough) and to isolate the GreenBoost feeder's
# GPU from other PCIe peers on chipsets that don't expose native ACS.
# Audited 2026-07-09: CachyOS and Xanmod both fold ACS handling into their
# upstream trees rather than shipping it as a standalone patch, so TKG
# (linux-tkg-patches/7.1/0006-add-acs-overrides_iommu.patch) is the only
# vendor carrying it as a discrete file for 7.1.
0018-tkg-pci-acs-override.patch  file://$KI_ROOT/patches/custom/0018-tkg-pci-acs-override.patch  122139befc3da25b00b5119e9a2fc59b266ed0de53f36912e9e60f3287c479d6  local-file

