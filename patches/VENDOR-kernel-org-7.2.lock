# ─── 0023 note ───────────────────────────────────────────────────────────────
# Re-anchored by hand for 7.2 and re-pinned as
# ../custom/0023-mm-bpf-cache-ext-page-cache-eviction-7.2.patch. The 7.1.10
# file is kept alongside it, unchanged, so the two ports stay comparable.
#
# The whole 7.1.10 -> 7.2 delta was two include blocks drifting underneath the
# patch: kernel/bpf/verifier.c gained <linux/cnum.h> and mm/memcontrol.c
# gained "swap_table.h", both inside this patch's three-line context. No
# semantic change was needed. `git am --3way` failed blaming
# include/linux/btf_ids.h — the FIRST file in the patch, not either real site,
# the same misleading report the 7.1.5 BORE port produced. `git apply --check
# -v` named kernel/bpf/verifier.c:28 correctly, which is why gitops.apply_series
# runs it on failure.
#
# Re-checked after porting, because this is the patch that shipped broken once:
# both kfunc sets still use BTF_KFUNCS_START/END, and 7.2's
# register_btf_kfunc_id_set() still rejects a set without BTF_SET8_KFUNCS
# (kernel/bpf/btf.c:9190; it was :9004 on 7.1). Still correct, still required.
