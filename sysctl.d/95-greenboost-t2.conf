# T2 (DDR-as-VRAM) reclaim/compaction tuning — hyphaed Phase 2, optimal-kernel plan.
# Goal: keep 2 MB THP allocations for the managed-UVM T2 pool (Path C,
# gb_vmm_t2_alloc_blackwell_managed) off the direct-reclaim path during model load.
#
# vm.swappiness is intentionally NOT set here — owned by GreenBoost's own
# /etc/sysctl.d/99-zzz-greenboost.conf (already =10). Merge order (95 < 99) means
# that file wins on any overlap anyway; duplicating the key here would just be
# two sources of truth for the same knob.

# Default 67584 (66 MB) is sized for a much smaller box. Raised so kswapd stays
# ahead of the allocator instead of the T2 pool's 2 MB THP faults hitting
# direct reclaim mid-inference.
vm.min_free_kbytes = 1048576

# Default 10 (0.1%). Higher wakes kswapd earlier relative to min_free_kbytes,
# same rationale as above.
vm.watermark_scale_factor = 150

# Keeps 2 MB blocks defragmented as uptime fragments the zone, for the same
# THP-backed managed allocations.
vm.compaction_proactiveness = 20
